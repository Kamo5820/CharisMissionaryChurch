     data-mission-heading="What We Are Called To Do"
     data-mission-text="Our mission is to win souls for the Kingdom of God, make disciples and release purpose through the transformative power of the gospel. We are committed to proclaiming the gospel of Jesus Christ with power and authority, ministering deliverance to the oppressed, healing the sick and prophetic direction for God's people."
     data-mission-text2="We aim to build a Christ-Centered ministry where the Holy Spirit brings transformation, restoration and hope. Through prayer and teaching, we strive to equip believers to walk in freedom, to grow in faith and to fulfil their divine calling."
