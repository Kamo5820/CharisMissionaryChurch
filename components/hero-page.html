<section class="page-hero" style="background: linear-gradient(rgba(26, 39, 68, 0.7), rgba(26, 39, 68, 0.55)), image-set(url('{{bgImageWebp}}') type('image/webp'), url('{{bgImage}}') type('image/jpeg')); background-size: cover; background-position: center; background-repeat: no-repeat;">
    <div class="container" style="text-align: center;">
        <span class="hero-subtitle">{{subtitle}}</span>
        <h1>{{title}}</h1>
        <p>{{description}}</p>
        {{verseBlock}}
    </div>
</section>
