<style>
    .faith-section {
        background: var(--bg);
        position: relative;
        overflow: hidden;
        padding: 120px 0;
    }

    .faith-section__bg-pattern {
        position: absolute;
        inset: 0;
        opacity: 0.018;
        background-image: radial-gradient(var(--dark) 1px, transparent 1px);
        background-size: 32px 32px;
        pointer-events: none;
    }
    .faith-section__glow {
        position: absolute;
        width: 450px;
        height: 450px;
        border-radius: 50%;
        filter: blur(140px);
        pointer-events: none;
        opacity: 0;
        transition: opacity 1.5s ease;
    }
    .faith-section.in-view .faith-section__glow { opacity: 1; }
    .faith-section__glow--left {
        bottom: -200px;
        left: -100px;
        background: var(--gold);
        opacity: 0.05;
    }
    .faith-section__glow--right {
        top: -180px;
        right: -80px;
        background: #6366f1;
        opacity: 0.03;
    }

    .faith-section .section-label { color: var(--gold); }
    .faith-section .section-label::before,
    .faith-section .section-label::after { background: var(--gold); }

    .faith__grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 28px;
        position: relative;
        z-index: 2;
    }

    .faith__card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 36px 28px 28px;
        position: relative;
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        display: flex;
        flex-direction: column;
    }

    .faith__card-glow {
        position: absolute;
        bottom: -60px;
        left: 50%;
        transform: translateX(-50%);
        width: 200px;
        height: 120px;
        background: var(--gold);
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0;
        transition: opacity 0.5s;
        pointer-events: none;
    }
    .faith__card:hover .faith__card-glow { opacity: 0.12; }

    .faith__card:hover {
        transform: translateY(-8px);
        box-shadow: 0 16px 48px rgba(26, 26, 46, 0.1);
        border-color: transparent;
    }

    .faith__card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
    }

    .faith__num {
        font-family: var(--font-display);
        font-size: 3.5rem;
        font-weight: 800;
        color: var(--gold-glow);
        line-height: 1;
        transition: color 0.4s;
        user-select: none;
    }
    .faith__card:hover .faith__num { color: var(--gold); }

    .faith__icon-wrap {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: var(--gold-glow);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .faith__icon-wrap i {
        font-size: 1.1rem;
        color: var(--gold);
        transition: all 0.4s;
    }
    .faith__card:hover .faith__icon-wrap {
        background: var(--gold);
        transform: rotate(-6deg) scale(1.08);
    }
    .faith__card:hover .faith__icon-wrap i { color: white; }

    .faith__heading {
        font-family: var(--font-display);
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--dark);
        margin-bottom: 14px;
        letter-spacing: -0.01em;
    }

    .faith__text {
        font-size: 0.9rem;
        color: var(--text-muted);
        line-height: 1.75;
        flex: 1;
        margin-bottom: 20px;
    }

    .faith__scripture {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--gold);
        background: var(--gold-glow);
        padding: 6px 14px;
        border-radius: 60px;
        transition: all 0.3s;
    }
    .faith__scripture i {
        font-size: 0.55rem;
        opacity: 0.6;
    }
    .faith__card:hover .faith__scripture {
        background: var(--gold);
        color: white;
    }
    .faith__card:hover .faith__scripture i { opacity: 1; }

    @media (max-width: 1024px) {
        .faith__grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
        .faith__grid { grid-template-columns: 1fr; }
        .faith-section { padding: 80px 0; }
    }
</style>

<section class="faith-section" aria-labelledby="faith-title">
    <div class="faith-section__bg-pattern"></div>
    <div class="faith-section__glow faith-section__glow--left"></div>
    <div class="faith-section__glow faith-section__glow--right"></div>

    <div class="container">
        <div class="section-title">
            <h2 id="faith-title">{{title}}</h2>
            <p>{{subtitle}}</p>
        </div>

        <div class="faith__grid">
            <div class="faith__card">
                <div class="faith__card-glow"></div>
                <div class="faith__card-top">
                    <span class="faith__num">01</span>
                    <div class="faith__icon-wrap"><i class="{{icon1}}"></i></div>
                </div>
                <h3 class="faith__heading">{{heading1}}</h3>
                <p class="faith__text">{{text1}}</p>
                <span class="faith__scripture"><i class="fas fa-scroll"></i> {{verse1}}</span>
            </div>
            <div class="faith__card">
                <div class="faith__card-glow"></div>
                <div class="faith__card-top">
                    <span class="faith__num">02</span>
                    <div class="faith__icon-wrap"><i class="{{icon2}}"></i></div>
                </div>
                <h3 class="faith__heading">{{heading2}}</h3>
                <p class="faith__text">{{text2}}</p>
                <span class="faith__scripture"><i class="fas fa-scroll"></i> {{verse2}}</span>
            </div>
            <div class="faith__card">
                <div class="faith__card-glow"></div>
                <div class="faith__card-top">
                    <span class="faith__num">03</span>
                    <div class="faith__icon-wrap"><i class="{{icon3}}"></i></div>
                </div>
                <h3 class="faith__heading">{{heading3}}</h3>
                <p class="faith__text">{{text3}}</p>
                <span class="faith__scripture"><i class="fas fa-scroll"></i> {{verse3}}</span>
            </div>
        </div>
    </div>
</section>
