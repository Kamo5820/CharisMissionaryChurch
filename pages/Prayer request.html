<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Charis Prayer Wall | Sacred Portal (ZAR)</title>
  <link rel="icon" href="../images/logo.jpg" type="image/jpeg">
  <meta name="description" content="Submit your prayer requests to the Charis Missionary Church prayer wall. Join our community in faith-filled prayer.">
  <meta property="og:title" content="Charis Prayer Wall | Sacred Portal (ZAR)">
  <meta property="og:description" content="Submit your prayer requests to the Charis Missionary Church prayer wall. Join our community in faith-filled prayer.">
  <meta property="og:image" content="../images/logo.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Google Fonts + Font Awesome 6 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #f8f6f3;
      --bg-surface: #f5f2ed;
      --card-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(34, 106, 214, 0.2);
      --primary: #226ad6;
      --primary-glow: #4d6bff;
      --secondary: #D97706;
      --accent-pink: #EC4899;
      --text-gold: #B8860B;
      --text-light: #2c2a28;
      --text-dim: #6b6560;
      --success-emerald: #10b981;
      --shadow-neon: 0 0 15px rgba(34, 106, 214, 0.15);
      --border-radius-xl: 32px;
      --border-radius-2xl: 48px;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 10% 20%, #f8f6f3, #f5f2ed, #f0ece7);
      color: var(--text-light);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* animated bg orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(34,106,214,0.2) 0%, rgba(77,107,255,0.1) 100%);
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }
    .orb-1 { width: 60vw; height: 60vw; top: -20vh; right: -10vw; }
    .orb-2 { width: 50vw; height: 50vw; bottom: -15vh; left: -20vw; background: radial-gradient(circle, rgba(217,119,6,0.12), rgba(34,106,214,0.05)); }

    /* main container */
    .main-container {
      position: relative;
      z-index: 2;
      max-width: 1400px;
      margin: 0 auto;
      padding: 9rem 2rem 2rem;
    }

    /* header */
    .glow-header {
      text-align: center;
      margin-bottom: 3rem;
    }
    .chip {
      display: inline-flex;
      background: rgba(34, 106, 214, 0.1);
      backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border);
      border-radius: 60px;
      padding: 6px 18px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 1px;
      color: var(--primary);
      margin-bottom: 1rem;
    }
    .glow-header h1 {
      font-size: 3.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #1a1a2e, #226ad6, #4d6bff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 0.5rem;
    }
    .glow-header p {
      color: var(--text-dim);
      max-width: 600px;
      margin: 0 auto;
    }

    /* card grid layout - totally revamped */
    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 2.5rem;
    }

    /* glass card design */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: var(--border-radius-2xl);
      padding: 2rem;
      transition: transform 0.25s ease, box-shadow 0.3s ease;
      box-shadow: 0 25px 40px -12px rgba(0,0,0,0.4);
    }
    .glass-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 30px 50px -15px rgba(34, 106, 214, 0.25);
      border-color: rgba(34, 106, 214, 0.5);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2rem;
      border-bottom: 1px dashed rgba(34, 106, 214, 0.3);
      padding-bottom: 1rem;
    }
    .card-header i {
      font-size: 2rem;
      color: var(--primary);
      background: rgba(34, 106, 214, 0.1);
      padding: 12px;
      border-radius: 24px;
    }
    .card-header h2 {
      font-weight: 700;
      font-size: 1.6rem;
      letter-spacing: -0.3px;
    }

    /* modern form fields */
    .input-frost {
      width: 100%;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(34, 106, 214, 0.3);
      border-radius: 28px;
      padding: 14px 20px;
      font-family: inherit;
      font-size: 0.9rem;
      color: #2c2a28;
      transition: all 0.2s;
      outline: none;
    }
    .input-frost:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(34, 106, 214, 0.2);
      background: rgba(255, 255, 255, 1);
    }
    .input-frost:hover {
      border-color: var(--primary);
    }
    label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      display: block;
      color: var(--text-dim);
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    select {
      cursor: pointer;
    }
    textarea {
      resize: vertical;
    }
    .custom-area {
      background: rgba(255, 255, 255, 0.6);
      border-radius: 28px;
      margin-top: 12px;
      animation: fadeSlide 0.3s ease;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-8px);}
      to { opacity: 1; transform: translateY(0);}
    }
    .word-count-badge {
      text-align: right;
      font-size: 0.7rem;
      margin-top: 6px;
      color: var(--text-dim);
    }
    .btn-primary {
      background: linear-gradient(95deg, #226ad6, #1a5ab8);
      border: none;
      border-radius: 60px;
      padding: 15px 24px;
      font-weight: 700;
      font-size: 1rem;
      color: white;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 12px;
    }
    .btn-primary:hover {
      transform: scale(1.02);
      background: linear-gradient(95deg, #2b7ae6, #1a5ab8);
      box-shadow: 0 0 18px rgba(34, 106, 214, 0.4);
    }
    .feedback-msg {
      margin-top: 16px;
      text-align: center;
      font-size: 0.85rem;
      padding: 10px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.6);
    }

    /* time slot premium design */
    .slot-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
    }
    .slot-item {
      background: rgba(255, 255, 255, 0.7);
      border-radius: 100px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border: 1px solid rgba(34, 106, 214, 0.2);
      transition: all 0.2s;
    }
    .slot-item:hover {
      background: rgba(34, 106, 214, 0.08);
      transform: translateX(6px);
      border-color: var(--primary);
    }
    .slot-item.selected {
      background: rgba(34, 106, 214, 0.12);
      border-color: var(--primary);
      box-shadow: 0 5px 15px rgba(34,106,214,0.2);
    }
    .slot-time {
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .slot-price {
      font-weight: 800;
      color: var(--secondary);
      font-size: 1.1rem;
    }
    .price-hero {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 48px;
      padding: 20px;
      text-align: center;
      margin: 20px 0;
      border: 1px dashed var(--primary);
    }
    .amount-number {
      font-size: 3rem;
      font-weight: 800;
      color: var(--primary);
    }
    .offering-note-modern {
      background: rgba(255, 255, 255, 0.7);
      border-radius: 28px;
      padding: 18px;
      margin: 20px 0;
      border-left: 4px solid var(--secondary);
      font-size: 0.85rem;
    }
    .payment-btn {
      background: var(--primary);
      border: 1px solid rgba(34, 106, 214, 0.3);
      border-radius: 60px;
      padding: 16px;
      font-weight: 700;
      width: 100%;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: 0.2s;
      cursor: pointer;
    }
    .payment-btn:hover {
      background: #1a5ab8;
      transform: translateY(-3px);
      border-color: var(--primary);
    }
    .testimonial-card {
      background: rgba(255, 255, 255, 0.75);
      border-radius: 36px;
      padding: 24px;
      margin-top: 24px;
      font-style: normal;
      backdrop-filter: blur(4px);
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
      gap: 12px;
    }
    .stat-block {
      flex: 1;
      background: rgba(34, 106, 214, 0.08);
      border-radius: 28px;
      padding: 12px;
      text-align: center;
    }
    @media (max-width: 900px) {
      .dashboard-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 1.5rem;
      }
      .glow-header h1 { font-size: 2rem; }
    }
    hr {
      border-color: rgba(34,106,214,0.2);
      margin: 12px 0;
    }
    .small-footer {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 3rem;
    }
    i.fa, i.far, i.fas {
      pointer-events: none;
    }
  </style>
</head>
<body>
<header id="mainHeader" data-include="../components/header.html" data-asset="../" data-page=""></header>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="main-container">
  <div class="glow-header">
    <div class="chip"><i class="fas fa-dove"></i> SACRED INTERCESSION · ZAR MINISTRY</div>
    <h1>Charis Prayer Wall</h1>
    <p>Present your requests</p>
  </div>

  <div class="dashboard-grid">
    <!-- LEFT CARD: PRAYER REQUEST -->
    <div data-include="../components/prayer-form.html" data-card-title="Submit Prayer Request"></div>

    <!-- RIGHT CARD: OFFERING & TIME SLOTS -->
    <div data-include="../components/offering-form.html" data-card-title="Offering & Prayer Vigil " data-card-badge='<span style="font-size:0.7rem; background:rgba(34,106,214,0.12); padding:4px 12px; border-radius:40px;">ZAR Currency</span>'></div>
  </div>
  <div class="small-footer"><i class="fas fa-globe-africa"></i> Charis South Africa · All transactions & prayers are handled with integrity. Powered by intercessors.</div>
</div>

<script>
// ============================================================
// EMAILJS - SAME CONFIG (FULL FUNCTIONALITY PRESERVED)
// ============================================================
const EMAILJS_PUBLIC_KEY = "MSiG_n3G0WXuOFNAp";
const EMAILJS_SERVICE_ID = "service_d8wpw29";
const EMAILJS_TEMPLATE_ID = "template_sk17a3p";

emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
console.log("✅ EmailJS active (Charis modern redesign)");

// TIME SLOTS DATA (ZAR)
const timeSlots = [
  { id: "slot_morning", label: "🌅 Morning Breakthrough (6:00 - 9:00 SAST)", price: 120.00, desc: "Dawn favor" },
  { id: "slot_afternoon", label: "☀️ Noon Fire (12:00 - 15:00)", price: 180.00, desc: "Financial alignment" },
  { id: "slot_evening", label: "🌙 Evening Glory (18:00 - 21:00)", price: 250.00, desc: "Family restoration" },
  { id: "slot_midnight", label: "⭐ Midnight Watch (00:00 - 03:00)", price: 350.00, desc: "Strategic warfare" }
];

// Testimonials data
const testimonialsModern = [
  { quote: "Morning breakthrough slot shifted my business. I received a contract worth R150k within a week.", author: "Lerato M.", city: "Cape Town" },
  { quote: "After submitting prayer for my son, he was healed. The prayer team is anointed.", author: "Pastor Sipho D.", city: "Durban" },
  { quote: "The midnight vigil gave me supernatural peace. God came through for my family.", author: "Naledi K.", city: "Pretoria" },
  { quote: "Partnering with R250 unlocked a financial door I never expected. Charis is genuine.", author: "Thabo R.", city: "Soweto" }
];

function formatZAR(amt) { return amt.toFixed(2); }

function countWords(str) { return str.trim() === "" ? 0 : str.trim().split(/\s+/).length; }

function showFeedback(el, message, isError = false) {
  el.style.display = "block";
  el.innerHTML = `<i class="fas ${isError ? 'fa-circle-exclamation' : 'fa-check-circle'}"></i> ${message}`;
  el.style.background = isError ? "rgba(220,38,38,0.2)" : "rgba(16,185,129,0.2)";
  el.style.color = isError ? "#b91c1c" : "#065f46";
  setTimeout(() => { if(el) el.style.display = "none"; }, 6000);
}

async function sendPrayerToGmail(userName, userPhone, userEmail, category, prayerMsgText, offeringAmount, timeSlotLabel) {
  if (!userName.trim()) throw new Error("Full name is required.");
  if (!userEmail.trim() || !userEmail.includes('@')) throw new Error("Valid email required.");
  if (category === "Custom" && (!prayerMsgText || prayerMsgText.trim() === "")) throw new Error("Write your custom prayer request.");

  const formattedMessage = `🕯️ CHARIS PRAYER WALL (Modern Portal)\n\nName: ${userName}\nEmail: ${userEmail}\nPhone: ${userPhone || "—"}\nCategory: ${category}\n\n🙏 Prayer Request:\n${prayerMsgText}\n\n💸 Seed Offering (ZAR): R ${offeringAmount.toFixed(2)}\n⏰ Time Slot: ${timeSlotLabel}\n---\nSubmitted from redesigned interface. Prayer team will respond.`;
  const currentTime = new Date().toLocaleString('en-ZA', { dateStyle: 'full', timeStyle: 'medium' });
  const templateParams = {
    from_name: userName,
    prayer_category: category,
    name: userName,
    time: currentTime,
    message: formattedMessage
  };
  return await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
}

// Initialize everything that depends on DOM (forms loaded via data-include)
function initPrayerForms() {
  const nameInput = document.getElementById('prayerName');
  const phoneInput = document.getElementById('prayerPhone');
  const emailInput = document.getElementById('prayerEmail');
  const categorySelect = document.getElementById('prayerCategory');
  const customContainer = document.getElementById('customRequestContainer');
  const customTextarea = document.getElementById('customPrayerText');
  const wordCountSpan = document.getElementById('wordCountDisplay');
  const submitBtn = document.getElementById('submitPrayerBtn');
  const feedbackDiv = document.getElementById('prayerFeedback');
  const amountSpan = document.getElementById('amountValue');

  if (!nameInput || !submitBtn) return;

  let currentSelectedSlotId = "slot_morning";
  let currentAmount = 120.00;

  function renderSlots() {
    const container = document.getElementById('slotOptionsContainer');
    if (!container) return;
    container.innerHTML = '';
    timeSlots.forEach(slot => {
      const slotDiv = document.createElement('div');
      slotDiv.className = `slot-item ${currentSelectedSlotId === slot.id ? 'selected' : ''}`;
      slotDiv.setAttribute('data-id', slot.id);
      slotDiv.innerHTML = `
        <div class="slot-time"><i class="fas fa-hourglass-start"></i> ${slot.label}</div>
        <div class="slot-price">R ${slot.price.toFixed(2)}</div>
      `;
      slotDiv.addEventListener('click', () => {
        document.querySelectorAll('.slot-item').forEach(el => el.classList.remove('selected'));
        slotDiv.classList.add('selected');
        currentSelectedSlotId = slot.id;
        currentAmount = slot.price;
        amountSpan.innerText = formatZAR(currentAmount);
      });
      container.appendChild(slotDiv);
    });
  }

  function setDefaultAmount() {
    const def = timeSlots.find(s => s.id === currentSelectedSlotId);
    if(def) currentAmount = def.price;
    amountSpan.innerText = formatZAR(currentAmount);
  }
  renderSlots();
  setDefaultAmount();

  function updateWordCount() {
    const text = customTextarea.value;
    const words = countWords(text);
    wordCountSpan.innerText = `${words} / 50 words`;
    if (words > 50) {
      wordCountSpan.style.color = "#dc2626";
      const truncated = text.trim().split(/\s+/).slice(0, 50).join(' ');
      customTextarea.value = truncated;
      updateWordCount();
    } else {
      wordCountSpan.style.color = "var(--text-dim)";
    }
  }

  function toggleCustomContainer() {
    if (categorySelect.value === "Custom") {
      customContainer.style.display = "block";
    } else {
      customContainer.style.display = "none";
      customTextarea.value = "";
      updateWordCount();
    }
  }
  categorySelect.addEventListener('change', toggleCustomContainer);
  customTextarea.addEventListener('input', updateWordCount);
  toggleCustomContainer();
  updateWordCount();

  submitBtn.addEventListener('click', async () => {
    const name = nameInput.value.trim();
    const phone = phoneInput.value.trim();
    const email = emailInput.value.trim();
    const category = categorySelect.value;
    let customMsg = "";
    if (category === "Custom") {
      customMsg = customTextarea.value.trim();
      if (countWords(customMsg) > 50) { showFeedback(feedbackDiv, "⚠️ Prayer must be under 50 words.", true); return; }
      if (!customMsg) { showFeedback(feedbackDiv, "✍️ Please write your prayer request.", true); return; }
    }
    const finalMsg = category === "Custom" ? customMsg : `Prayer need regarding ${category} — Lord intervene.`;
    const selectedSlot = timeSlots.find(s => s.id === currentSelectedSlotId) || timeSlots[0];
    const slotLabel = selectedSlot.label;
    const offeringAmount = currentAmount;

    submitBtn.disabled = true;
    const originalText = submitBtn.innerHTML;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Submitting prayer...';
    try {
      await sendPrayerToGmail(name, phone, email, category, finalMsg, offeringAmount, slotLabel);
      showFeedback(feedbackDiv, "✅ Prayer request sent! Our intercessors will stand with you. God bless.", false);
      nameInput.value = "";
      phoneInput.value = "";
      emailInput.value = "";
      categorySelect.value = "Healing";
      customTextarea.value = "";
      toggleCustomContainer();
      updateWordCount();
      const fake = document.getElementById('fakeCounter');
      if(fake) {
        let curr = parseInt(fake.innerText) || 372;
        fake.innerText = curr + 1;
      }
    } catch (err) {
      console.error(err);
      showFeedback(feedbackDiv, `❌ ${err.message || "EmailJS error. Check service/template IDs."}`, true);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = originalText;
    }
  });

  // PAYMENT GATEWAY — opens ABSA bank transfer modal (real)
  const paymentBtn = document.getElementById('paymentGatewayBtn');

  if (paymentBtn) {
    paymentBtn.addEventListener('click', () => {
      const selectedSlot = timeSlots.find(s => s.id === currentSelectedSlotId) || timeSlots[0];
      const slotName = selectedSlot.label;
      const payAmount = currentAmount;
      const ref = 'ZAR-' + Math.random().toString(36).substr(2, 8).toUpperCase();

      const bankModal = document.getElementById('bankModal');
      const modalAmount = document.getElementById('modalAmount');
      const modalType = document.getElementById('modalType');
      const modalRef = document.getElementById('modalRef');

      if (bankModal && modalAmount && modalType && modalRef) {
        modalAmount.textContent = 'R ' + payAmount.toFixed(2);
        modalType.textContent = slotName;
        modalRef.textContent = ref;
        bankModal.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      const statusMsg = document.getElementById('paymentStatusMsg');
      if (statusMsg) {
        statusMsg.innerHTML = '';
        statusMsg.style.padding = '0';
      }
    });
  }

  // Testimonial rotator
  let idx = 0;
  const testimonialEl = document.getElementById('dynamicTestimonial');
  function rotateTesti() {
    if(!testimonialEl) return;
    const t = testimonialsModern[idx % testimonialsModern.length];
    testimonialEl.innerHTML = `<i class="fas fa-quote-right" style="color: #226ad6; opacity:0.6;"></i>
      <p style="margin: 10px 0; font-style:italic;">“${t.quote}”</p>
      <strong>- ${t.author}</strong> <span style="font-size:0.7rem;">${t.city}</span>`;
    idx++;
  }
  rotateTesti();
  setInterval(rotateTesti, 6500);

  // ensure default slot highlighting
  setTimeout(() => {
    document.querySelectorAll('.slot-item').forEach(el => {
      if(el.getAttribute('data-id') === currentSelectedSlotId) el.classList.add('selected');
    });
  }, 50);
}

document.addEventListener('includesLoaded', initPrayerForms);
</script>

<script src="../assets/js/main.js" defer></script>
</body>
</html>
