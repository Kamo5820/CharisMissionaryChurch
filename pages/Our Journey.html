<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Photo Gallery | Charis Missionary Church</title>
    <link rel="icon" href="../images/logo.jpg" type="image/jpeg">
    <meta name="description" content="Browse the photo gallery of Charis Missionary Church. See moments from our journey of faith, worship, and community.">
    <meta property="og:title" content="Photo Gallery | Charis Missionary Church">
    <meta property="og:description" content="Browse the photo gallery of Charis Missionary Church. See moments from our journey of faith, worship, and community.">
    <meta property="og:image" content="../images/logo.jpg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        :root {
            --bg-dark: #f5f3f0;
            --card-bg: #ffffff;
            --accent: #226ad6;
            --text-light: #2c2a28;
            --text-dim: #6b6560;
            --border: #e5e0db;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 8px 25px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 50px rgba(0,0,0,0.12);
            --radius: 14px;
            --gap: 14px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
        }

        .toast-notification {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(14px);
            border-left: 5px solid var(--accent);
            padding: 14px 24px;
            border-radius: 16px;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10000;
            transform: translateX(120%);
            transition: transform 0.25s ease-out;
            pointer-events: none;
        }
        .toast-notification.show { transform: translateX(0%); }
        .toast-notification i { color: var(--accent); }

        .encryption-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 1;
        }

        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 5rem;
            position: relative;
            z-index: 2;
        }

        .gallery-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .gallery-header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: #226ad6;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
        }
        .gallery-header p {
            color: var(--text-dim);
            font-size: 1.05rem;
            margin-top: 0.5rem;
        }

        .gallery-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding: 0 4px;
        }
        .gallery-bar .count {
            font-size: 0.85rem;
            color: var(--text-dim);
            font-weight: 500;
        }
        .gallery-bar .count span {
            color: var(--accent);
            font-weight: 700;
        }
        .view-toggle {
            display: flex;
            gap: 4px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 4px;
        }
        .view-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            border-radius: 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .view-btn.active {
            background: var(--accent);
            color: white;
        }
        .view-btn:hover:not(.active) {
            color: var(--text-light);
            background: #f0eeeb;
        }

        /* ============ MASONRY GRID ============ */
        .photo-grid {
            columns: 4;
            column-gap: var(--gap);
        }
        .photo-grid.cols-3 { columns: 3; }
        .photo-grid.cols-2 { columns: 2; }

        .photo-card {
            break-inside: avoid;
            margin-bottom: var(--gap);
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            background: #e8e5e1;
            box-shadow: var(--shadow-sm);
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1);
        }
        .photo-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
            z-index: 5;
        }
        .photo-card img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.4, 1), filter 0.4s ease;
            pointer-events: none;
        }
        .photo-card:hover img {
            transform: scale(1.04);
            filter: brightness(0.9);
        }

        .photo-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.65) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 24px 16px 14px;
        }
        .photo-card:hover .photo-overlay { opacity: 1; }
        .photo-overlay .overlay-icon {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(8px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.9rem;
            margin-bottom: 6px;
            border: 1px solid rgba(255,255,255,0.25);
            transition: all 0.25s;
        }
        .photo-card:hover .overlay-icon {
            background: var(--accent);
            border-color: var(--accent);
            transform: scale(1.1);
        }
        .photo-overlay .overlay-label {
            color: white;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .photo-index {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 7px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .photo-card:hover .photo-index { opacity: 1; }

        .photo-card .shimmer {
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, #e8e5e1 30%, #f5f3f0 50%, #e8e5e1 70%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            z-index: 1;
        }
        .photo-card .shimmer.hidden { display: none; }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ============ LIGHTBOX ============ */
        .modern-lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(15, 13, 12, 0.97);
            z-index: 10001;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(16px);
            flex-direction: column;
        }
        .modern-lightbox.active { display: flex; }

        .lb-topbar {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 28px;
            z-index: 10;
        }
        .lb-counter {
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
            font-weight: 600;
        }
        .lb-counter span { color: white; }

        .lb-close {
            position: relative;
            top: auto; right: auto;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .lb-close:hover { background: rgba(255,255,255,0.15); }

        .lb-main {
            display: flex;
            align-items: center;
            gap: 20px;
            max-width: 92vw;
            max-height: 85vh;
        }

        .lb-nav-btn {
            flex-shrink: 0;
            width: 52px;
            height: 52px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .lb-nav-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            transform: scale(1.1);
        }

        .lb-image-wrap {
            position: relative;
            max-width: 80vw;
            max-height: 82vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lb-image {
            max-width: 80vw;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 8px;
            transition: transform 0.25s ease;
            cursor: grab;
        }
        .lb-image:active { cursor: grabbing; }

        .lb-bottombar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 20px;
            z-index: 10;
        }
        .lb-thumb-strip {
            display: flex;
            gap: 6px;
            max-width: 600px;
            overflow-x: auto;
            padding: 6px 4px;
            scrollbar-width: none;
        }
        .lb-thumb-strip::-webkit-scrollbar { display: none; }
        .lb-thumb {
            width: 52px;
            height: 52px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.4;
            transition: all 0.25s;
        }
        .lb-thumb.active {
            border-color: var(--accent);
            opacity: 1;
        }
        .lb-thumb:hover:not(.active) { opacity: 0.7; }
        .lb-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (max-width: 1024px) {
            .photo-grid { columns: 3; }
            .photo-grid.cols-3 { columns: 3; }
        }
        @media (max-width: 768px) {
            .gallery-header h1 { font-size: 2rem; }
            .photo-grid,
            .photo-grid.cols-3 { columns: 2; }
            :root { --gap: 10px; --radius: 10px; }
            .lb-main { gap: 10px; }
            .lb-nav-btn { width: 40px; height: 40px; font-size: 1rem; }
            .lb-image { max-width: 88vw; max-height: 75vh; }
            .lb-thumb { width: 44px; height: 44px; }
        }
        @media (max-width: 480px) {
            .photo-grid.cols-2 { columns: 2; }
            :root { --gap: 8px; --radius: 8px; }
            .gallery-container { padding: 1.5rem 1rem 4rem; }
        }
    </style>
</head>
<body>
<div class="encryption-bg"></div>
<div id="toastMsg" class="toast-notification"><i class="fas fa-shield-halved"></i> <span id="toastText">⛔ Screenshot blocked</span></div>

<div class="gallery-container">
    <div class="gallery-header">
        <h1>Gallery</h1>
        <p>Browse through our collection of moments and memories</p>
    </div>

    <div class="gallery-bar">
        <div class="count">Showing <span id="photoCount">0</span> photos</div>
        <div class="view-toggle">
            <button class="view-btn" data-cols="4" title="4 columns"><i class="fas fa-th"></i></button>
            <button class="view-btn active" data-cols="3" title="3 columns"><i class="fas fa-th-large"></i></button>
            <button class="view-btn" data-cols="2" title="2 columns"><i class="fas fa-square"></i></button>
        </div>
    </div>

    <div class="photo-grid cols-3" id="photoGrid"></div>
</div>

<div class="modern-lightbox" id="imageLightbox">
    <div class="lb-topbar">
        <div class="lb-counter"><span id="lbCurrent">1</span> / <span id="lbTotal">0</span></div>
        <button class="lb-close" id="lbCloseBtn">&times;</button>
    </div>
    <div class="lb-main">
        <button class="lb-nav-btn" id="lbPrev"><i class="fas fa-chevron-left"></i></button>
        <div class="lb-image-wrap">
            <img class="lb-image" id="lbImage" alt="Gallery lightbox">
        </div>
        <button class="lb-nav-btn" id="lbNext"><i class="fas fa-chevron-right"></i></button>
    </div>
    <div class="lb-bottombar">
        <div class="lb-thumb-strip" id="lbThumbStrip"></div>
    </div>
</div>

<script src="gallery-images.js"></script>
<script>
    // List auto-generated by scripts/generate-gallery.js.
    // Rebuild after adding/removing photos: node scripts/generate-gallery.js
    let ALL_IMAGES = (window.GALLERY_IMAGES || []).slice();

    let lbIndex = 0;
    const grid = document.getElementById("photoGrid");
    const photoCountEl = document.getElementById("photoCount");
    const lightbox = document.getElementById("imageLightbox");

    function showToast(msg) {
        const t = document.getElementById("toastMsg");
        document.getElementById("toastText").innerText = msg || "⛔ Action blocked";
        t.classList.remove("show");
        setTimeout(() => t.classList.add("show"), 10);
        setTimeout(() => t.classList.remove("show"), 3200);
    }

    function initProtection() {
        window.addEventListener("contextmenu", e => { e.preventDefault(); showToast("🖱️ Right-click disabled"); });
        window.addEventListener("keydown", e => {
            if (e.key === "PrintScreen") { e.preventDefault(); showToast("📸 Screenshot blocked!"); }
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === "S") { e.preventDefault(); showToast("⛔ Snipping tool disabled"); }
            if (e.ctrlKey && (e.key === 'c' || e.key === 'C')) { e.preventDefault(); showToast("✖️ Copying media not allowed"); }
            if (e.key === "F12" || (e.ctrlKey && e.shiftKey && e.key === "I")) { e.preventDefault(); showToast("🔒 DevTools restricted"); }
        });
        window.addEventListener("blur", () => showToast("⚠️ Screenshot attempt detected"));
        setInterval(() => document.querySelectorAll('img').forEach(i => i.setAttribute('draggable', 'false')), 300);
    }

    function buildGrid() {
        grid.innerHTML = "";
        photoCountEl.innerText = ALL_IMAGES.length;

        ALL_IMAGES.forEach((src, idx) => {
            const card = document.createElement("div");
            card.className = "photo-card";
            card.innerHTML = `
                <div class="shimmer"></div>
                <img src="${src}" alt="Photo ${idx + 1}" loading="lazy"
                     onload="this.previousElementSibling.classList.add('hidden')"
                     onerror="this.src='https://placehold.co/600x800/e8e5e1/6b6560?text=Photo+${idx+1}';this.previousElementSibling.classList.add('hidden')">
                <div class="photo-index">${idx + 1}</div>
                <div class="photo-overlay">
                    <div class="overlay-icon"><i class="fas fa-expand"></i></div>
                    <div class="overlay-label">View</div>
                </div>
            `;
            card.addEventListener("click", () => openLightbox(idx));
            grid.appendChild(card);
        });
    }

    function animateGridIn() {
        const cards = grid.querySelectorAll(".photo-card");
        cards.forEach((card, i) => {
            card.style.opacity = "0";
            card.style.transform = "translateY(20px)";
            card.style.transition = `opacity 0.4s ease ${i * 20}ms, transform 0.4s cubic-bezier(0.2,0.9,0.4,1) ${i * 20}ms`;
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    card.style.opacity = "1";
                    card.style.transform = "translateY(0)";
                });
            });
        });
    }

    function openLightbox(idx) {
        lbIndex = idx;
        lightbox.classList.add("active");
        document.body.style.overflow = "hidden";
        updateLightbox();
        buildThumbs();
    }

    function closeLightbox() {
        lightbox.classList.remove("active");
        document.body.style.overflow = "auto";
    }

    function updateLightbox() {
        const img = document.getElementById("lbImage");
        img.src = ALL_IMAGES[lbIndex];
        img.alt = `Photo ${lbIndex + 1}`;
        img.style.transform = "scale(1)";
        document.getElementById("lbCurrent").innerText = lbIndex + 1;
        document.getElementById("lbTotal").innerText = ALL_IMAGES.length;
        document.querySelectorAll(".lb-thumb").forEach((t, i) => {
            t.classList.toggle("active", i === lbIndex);
        });
        const activeThumb = document.querySelector(".lb-thumb.active");
        if (activeThumb) activeThumb.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
    }

    function buildThumbs() {
        const strip = document.getElementById("lbThumbStrip");
        strip.innerHTML = "";
        ALL_IMAGES.forEach((src, i) => {
            const thumb = document.createElement("div");
            thumb.className = "lb-thumb" + (i === lbIndex ? " active" : "");
            thumb.innerHTML = `<img src="${src}" alt="thumb ${i+1}" onerror="this.src='https://placehold.co/80x80/e8e5e1/6b6560?text=${i+1}'">`;
            thumb.addEventListener("click", () => { lbIndex = i; updateLightbox(); });
            strip.appendChild(thumb);
        });
    }

    function lbNav(delta) {
        lbIndex = (lbIndex + delta + ALL_IMAGES.length) % ALL_IMAGES.length;
        updateLightbox();
    }

    function setColumns(n) {
        grid.classList.remove("cols-4", "cols-3", "cols-2");
        if (n !== 4) grid.classList.add("cols-" + n);
    }

    function init() {
        initProtection();

        document.querySelectorAll(".view-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".view-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                setColumns(parseInt(btn.dataset.cols));
            });
        });

        document.getElementById("lbCloseBtn").onclick = closeLightbox;
        document.getElementById("lbPrev").onclick = () => lbNav(-1);
        document.getElementById("lbNext").onclick = () => lbNav(1);
        lightbox.addEventListener("click", e => {
            if (e.target === lightbox || e.target.classList.contains("lb-image-wrap")) closeLightbox();
        });

        window.addEventListener("keydown", e => {
            if (lightbox.classList.contains("active")) {
                if (e.key === "ArrowLeft") { lbNav(-1); e.preventDefault(); }
                else if (e.key === "ArrowRight") { lbNav(1); e.preventDefault(); }
                else if (e.key === "Escape") closeLightbox();
                return;
            }
        });

        let touchStartX = 0;
        const lbImg = document.getElementById("lbImage");
        lbImg.addEventListener("touchstart", e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
        lbImg.addEventListener("touchend", e => {
            const diff = e.changedTouches[0].screenX - touchStartX;
            if (Math.abs(diff) > 50) lbNav(diff > 0 ? -1 : 1);
        }, { passive: true });

        buildGrid();
        animateGridIn();
    }

    init();
</script>
</body>
</html>
