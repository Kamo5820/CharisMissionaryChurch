<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Seed and Offering | Charis Missionary Church</title>
  <link rel="icon" href="../logo.jpg" type="image/jpeg">
  <meta name="description" content="Support the ministry of Charis Missionary Church through seeds and offerings. Give online securely and be part of God's work.">
  <meta property="og:title" content="Seed and Offering | Charis Missionary Church">
  <meta property="og:description" content="Support the ministry of Charis Missionary Church through seeds and offerings. Give online securely and be part of God's work.">
  <meta property="og:image" content="../logo.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #e8e0d4;
      --bg-surface: #ddd4c8;
      --card-bg: #e2ddd6;
      --glass-border: rgba(34, 106, 214, 0.2);
      --primary: #226ad6;
      --primary-glow: #4d6bff;
      --secondary: #226ad6;
      --accent-pink: #226ad6;
      --text-gold: #226ad6;
      --text-light: #226ad6;
      --text-dim: #226ad6;
      --success-emerald: #10b981;
      --shadow-neon: 0 0 15px rgba(34, 106, 214, 0.15);
      --border-radius-xl: 32px;
      --border-radius-2xl: 48px;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #ffffff;
      color: var(--text-light);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(34,106,214,0.15) 0%, rgba(200,146,62,0.1) 100%);
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }
    .orb-1 { width: 60vw; height: 60vw; top: -20vh; right: -10vw; }
    .orb-2 { width: 50vw; height: 50vw; bottom: -15vh; left: -20vw; background: radial-gradient(circle, rgba(200,146,62,0.1), rgba(34,106,214,0.05)); }

    .main-container {
      position: relative;
      z-index: 2;
      max-width: 800px;
      margin: 0 auto;
      padding: 9rem 2rem 2rem;
    }

    .glow-header {
      text-align: center;
      margin-bottom: 3rem;
    }
    .chip {
      display: inline-flex;
      background: rgba(139, 92, 246, 0.2);
      backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border);
      border-radius: 60px;
      padding: 6px 18px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 1px;
      color: var(--primary);
      margin-bottom: 1rem;
    }
    .glow-header h1 {
      font-size: 3.2rem;
      font-weight: 800;
      color: #226ad6;
      background: linear-gradient(135deg, #226ad6, #4d6bff);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .glow-header p {
      color: var(--text-dim);
      max-width: 600px;
      margin: 0 auto;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: var(--border-radius-2xl);
      padding: 2rem;
      transition: transform 0.25s ease, box-shadow 0.3s ease;
      box-shadow: 0 25px 40px -12px rgba(0,0,0,0.4);
    }
    .glass-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 30px 50px -15px rgba(34, 106, 214, 0.4);
      border-color: rgba(34, 106, 214, 0.6);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2rem;
      border-bottom: 1px dashed rgba(34, 106, 214, 0.2);
      padding-bottom: 1rem;
    }
    .card-header i {
      font-size: 2rem;
      color: var(--primary);
      background: rgba(34, 106, 214, 0.2);
      padding: 12px;
      border-radius: 24px;
    }
    .card-header h2 {
      font-weight: 700;
      font-size: 1.6rem;
      letter-spacing: -0.3px;
    }

    .slot-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
    }
    .slot-item {
      background: #d5cfc7;
      border-radius: 100px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border: 1px solid rgba(34, 106, 214, 0.2);
      transition: all 0.2s;
    }
    .slot-item:hover {
      background: #ccc5bc;
      transform: translateX(6px);
      border-color: var(--primary);
    }
    .slot-item.selected {
      background: linear-gradient(115deg, #e8f0fe, #dce8fa);
      border-color: var(--primary);
      box-shadow: 0 5px 15px rgba(34,106,214,0.3);
    }
    .slot-time {
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .slot-price {
      font-weight: 800;
      color: #226ad6;
      font-size: 1.1rem;
    }
    .price-hero {
      background: rgba(200, 146, 62, 0.08);
      border-radius: 48px;
      padding: 20px;
      text-align: center;
      margin: 20px 0;
      border: 1px dashed rgba(200, 146, 62, 0.3);
    }
    .amount-number {
      font-size: 3rem;
      font-weight: 800;
      color: #226ad6;
    }
    .offering-note-modern {
      background: rgba(245, 158, 11, 0.15);
      border-radius: 28px;
      padding: 18px;
      margin: 20px 0;
      border-left: 4px solid #226ad6;
      font-size: 0.85rem;
      color: #226ad6;
    }
    .payment-btn {
      background: #2c2a28;
      border: 1px solid #55504b;
      border-radius: 60px;
      padding: 16px;
      font-weight: 700;
      width: 100%;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: 0.2s;
      cursor: pointer;
    }
    .payment-btn:hover {
      background: #1a1a18;
      transform: translateY(-3px);
      border-color: #226ad6;
    }
    .testimonial-card {
      background: #d5cfc7;
      border-radius: 36px;
      padding: 24px;
      margin-top: 24px;
      font-style: normal;
    }

    .small-footer {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 3rem;
    }

    @media (max-width: 768px) {
      .glow-header h1 { font-size: 2rem; }
      .main-container { padding: 8rem 1rem 2rem; }
    }
  </style>
</head>
<body>
<header id="mainHeader" data-include="../components/header.html" data-asset="../" data-page=""></header>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="main-container">
  <div class="glow-header">
    <div class="chip"><i class="fas fa-hand-holding-heart"></i> GIVE SEED OFFERING</div>
    <h1>Seed and Offering</h1>

  </div>

  <div data-include="../components/offering-form.html" data-card-title="Offering & Prayer Vigil " data-card-badge='<span style="font-size:0.7rem; background:rgba(255,215,0,0.2); padding:4px 12px; border-radius:40px;">ZAR Currency</span>'></div>

  <div class="small-footer"><i class="fas fa-globe-africa"></i> All transactions handled with integrity. Powered by intercessors.</div>
</div>

<script>
// TIME SLOTS DATA (ZAR)
const timeSlots = [
  { id: "slot_morning", label: "🌅 Morning Breakthrough (6:00 - 9:00 SAST)", price: 120.00, desc: "Dawn favor" },
  { id: "slot_afternoon", label: "☀️ Noon Fire (12:00 - 15:00)", price: 180.00, desc: "Financial alignment" },
  { id: "slot_evening", label: "🌙 Evening Glory (18:00 - 21:00)", price: 250.00, desc: "Family restoration" },
  { id: "slot_midnight", label: "⭐ Midnight Watch (00:00 - 03:00)", price: 350.00, desc: "Strategic warfare" }
];

const testimonialsModern = [
  { quote: "Morning breakthrough slot shifted my business. I received a contract worth R150k within a week.", author: "Lerato M.", city: "Cape Town" },
  { quote: "After submitting prayer for my son, he was healed. The prayer team is anointed.", author: "Pastor Sipho D.", city: "Durban" },
  { quote: "The midnight vigil gave me supernatural peace. God came through for my family.", author: "Naledi K.", city: "Pretoria" },
  { quote: "Partnering with R250 unlocked a financial door I never expected. Charis is genuine.", author: "Thabo R.", city: "Soweto" }
];

function formatZAR(amt) { return amt.toFixed(2); }

function initOfferingForm() {
  const amountSpan = document.getElementById('amountValue');
  const paymentBtn = document.getElementById('paymentGatewayBtn');
  const paymentStatusMsgDiv = document.getElementById('paymentStatusMsg');
  const testimonialEl = document.getElementById('dynamicTestimonial');

  if (!amountSpan || !paymentBtn) return;

  let currentSelectedSlotId = "slot_morning";
  let currentAmount = 120.00;

  function renderSlots() {
    const container = document.getElementById('slotOptionsContainer');
    if (!container) return;
    container.innerHTML = '';
    timeSlots.forEach(slot => {
      const slotDiv = document.createElement('div');
      slotDiv.className = `slot-item ${currentSelectedSlotId === slot.id ? 'selected' : ''}`;
      slotDiv.setAttribute('data-id', slot.id);
      slotDiv.innerHTML = `
        <div class="slot-time"><i class="fas fa-hourglass-start"></i> ${slot.label}</div>
        <div class="slot-price">R ${slot.price.toFixed(2)}</div>
      `;
      slotDiv.addEventListener('click', () => {
        document.querySelectorAll('.slot-item').forEach(el => el.classList.remove('selected'));
        slotDiv.classList.add('selected');
        currentSelectedSlotId = slot.id;
        currentAmount = slot.price;
        amountSpan.innerText = formatZAR(currentAmount);
      });
      container.appendChild(slotDiv);
    });
  }

  function setDefaultAmount() {
    const def = timeSlots.find(s => s.id === currentSelectedSlotId);
    if(def) currentAmount = def.price;
    amountSpan.innerText = formatZAR(currentAmount);
  }
  renderSlots();
  setDefaultAmount();

  paymentBtn.addEventListener('click', () => {
    const selectedSlot = timeSlots.find(s => s.id === currentSelectedSlotId) || timeSlots[0];
    const slotName = selectedSlot.label;
    const payAmount = currentAmount;
    paymentBtn.disabled = true;
    paymentBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Processing ZAR Payment...';
    paymentStatusMsgDiv.innerHTML = '';
    setTimeout(() => {
      const txRef = 'ZAR-' + Math.random().toString(36).substr(2, 8).toUpperCase();
      paymentStatusMsgDiv.innerHTML = `<i class="fas fa-check-circle" style="color:#000000;"></i> ✅ Offering of R ${payAmount.toFixed(2)} ZAR received! (Slot: ${slotName}) Reference: ${txRef}. Prayer coverage confirmed.`;
      paymentStatusMsgDiv.style.background = "rgba(16,185,129,0.15)";
      paymentStatusMsgDiv.style.padding = "10px";
      paymentStatusMsgDiv.style.borderRadius = "60px";
      setTimeout(() => {
        paymentBtn.disabled = false;
        paymentBtn.innerHTML = '<i class="fas fa-donate"></i> Donate & Reserve Slot (ZAR) →';
      }, 2000);
    }, 1500);
  });

  let idx = 0;
  function rotateTesti() {
    if(!testimonialEl) return;
    const t = testimonialsModern[idx % testimonialsModern.length];
    testimonialEl.innerHTML = `<i class="fas fa-quote-right" style="color: #000000; opacity:0.8;"></i>
      <p style="margin: 10px 0; font-style:italic;">“${t.quote}”</p>
      <strong>- ${t.author}</strong> <span style="font-size:0.7rem;">${t.city}</span>`;
    idx++;
  }
  rotateTesti();
  setInterval(rotateTesti, 6500);

  setTimeout(() => {
    document.querySelectorAll('.slot-item').forEach(el => {
      if(el.getAttribute('data-id') === currentSelectedSlotId) el.classList.add('selected');
    });
  }, 50);
}

document.addEventListener('includesLoaded', initOfferingForm);
</script>

<script src="../assets/js/main.js" defer></script>
</body>
</html>
